name: Fix CEO Photo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore CEO photo and fix HTML
        env:
          CEO_B64: |
            " 
        run: |
          mkdir -p assets
          printf '%s' "$CEO_B64" | base64 -d > assets/ceo.jpg
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<img src="data:image/jpeg;base64,[^"]+" alt="Imdad Ali - CEO">', '<img src="assets/ceo.jpg" alt="Imdad Ali - CEO">', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ceo.jpg index.html
          git commit -m "Fix CEO photo asset" || exit 0
          git push
