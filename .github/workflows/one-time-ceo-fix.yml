name: One-time CEO team fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix CEO image and mobile order
        env:
          CEO_B64: ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=1000&q=90"
          new = "data:image/jpeg;base64," + os.environ["CEO_B64"]
          if old in s:
              s = s.replace(old, new, 1)
          marker = "/* CEO-MOBILE-FIRST-FIX */"
          css = marker + ".team-card.ceo{order:0}@media(max-width:750px){.team{display:grid;grid-template-columns:1fr}.team-card.ceo{order:-1}.ceo .team-photo{height:360px}}"
          if marker not in s:
              s = s.replace("</style>", css + "</style>", 1)
          p.write_text(s, encoding="utf-8")

          wf = Path(".github/workflows/one-time-ceo-fix.yml")
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "Moon Digital Studio"
          git config user.email "imdadmoon-cloud@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/one-time-ceo-fix.yml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Fix CEO photo and mobile team order"
          git push
